name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs check:js, check:cache-bust, test:smoke and test:dom.
      # check:cache-bust fails the build if ?v= asset stamps are stale, which
      # is what stops published users being served cached CSS or modules.
      - name: Run checks and tests
        run: npm test

